name: Daily Portfolio Update

on:
  schedule:
    # Main run: 2:00 PM UAE time (10:00 UTC) — fetches email + prices
    - cron: "0 10 * * 1-5"
    # Price-only refreshes during US market hours (2:30 PM - 10 PM UAE = 10:30-18:00 UTC)
    - cron: "30 10 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Fetch IBKR CSV + live prices
        env:
          OUTLOOK_CLIENT_ID:     ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_EMAIL:         ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
        run: python fetch_csv.py

      - name: Commit and push
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "bot@portfolio-analyzer"
          git add data/portfolio.csv data/prices.json data/meta.json
          git diff --cached --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
