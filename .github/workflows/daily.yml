name: Daily Portfolio Update

on:
  schedule:
    - cron: "0 10 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pandas openpyxl

      - name: Fetch IBKR CSV + live prices
        env:
          OUTLOOK_CLIENT_ID:     ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_EMAIL:         ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          FETCH_EMAIL: ${{ github.event.schedule == '0 10 * * 1-5' && 'true' || github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python fetch_csv.py

      - name: Fetch Crypto.com lots
        env:
          CDC_API_KEY:    ${{ secrets.CDC_API_KEY }}
          CDC_API_SECRET: ${{ secrets.CDC_API_SECRET }}
        run: python fetch_crypto.py

      - name: Commit and push
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "bot@portfolio-analyzer"
          git add data/portfolio.csv data/prices.json data/watchlist.json data/meta.json data/crypto_portfolio.json
          git diff --cached --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
