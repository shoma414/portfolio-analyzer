<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Analyzer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

</head>
<body>

<!-- ── Tabs ── -->
<div class="tabs" style="grid-template-columns:1fr 1fr 1fr;">
  <button class="tab-btn active" onclick="switchTab('lots')">📊 My Lots</button>
  <button class="tab-btn" onclick="switchTab('watchlist')">⭐ 52W Low</button>
  <button class="tab-btn" onclick="switchTab('signals')">📊 Signals</button>
</div>

<!-- ══════════════════════════════════════════════════
     TAB 1: MY LOTS
═══════════════════════════════════════════════════ -->
<div id="tab-lots">
  <div class="header">
    <h1>My Lot Positions</h1>
    <button class="refresh-btn" onclick="manualRefresh()">↻ Refresh</button>
  </div>
  <div class="last-updated" id="lastUpdated">Loading...</div>
  <div class="price-updated" id="priceUpdated"></div>
  <div class="status-bar" id="statusBar"></div>

  <label class="upload-btn" for="csvFile">↑ Or upload CSV manually</label>
  <input type="file" id="csvFile" accept=".csv">

  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-group">
        <label>Account</label>
        <select id="acctFilter"><option value="">All accounts</option></select>
      </div>
      <div class="ctrl-group">
        <label>Signal</label>
        <select id="signalFilter">
          <option value="">All</option>
          <option value="SELL">Sell signals</option>
          <option value="NEAR_SELL">Near sell</option>
          <option value="BUY">Buy signals</option>
        </select>
      </div>
    </div>
    <div class="ctrl-group full">
      <label>Symbol search</label>
      <input type="text" id="symFilter" placeholder="e.g. ORCL, ZTS">
    </div>
    <div class="pct-row">
      <div class="ctrl-group"><label>Sell %</label><input type="number" id="sellPct" value="10" min="1" max="100"></div>
      <div class="ctrl-group"><label>Near sell %</label><input type="number" id="nearPct" value="7" min="1" max="100"></div>
      <div class="ctrl-group"><label>Buy drop %</label><input type="number" id="buyPct" value="5" min="1" max="100"></div>
    </div>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>
  <div id="tableArea"></div>
</div>

<!-- ══════════════════════════════════════════════════
     TAB 2: WATCHLIST
═══════════════════════════════════════════════════ -->
<div id="tab-watchlist" style="display:none">
  <div class="header">
    <h1>Halal Watchlist</h1>
    <button class="refresh-btn" onclick="refreshWatchlist()">↻ Refresh</button>
  </div>
  <div class="price-updated" id="wlPriceUpdated">Loading prices...</div>

  <!-- Add symbol -->
  <div class="wl-add-row">
    <input type="text" id="wlAddInput" placeholder="Add symbol e.g. AAPL" maxlength="10">
    <button onclick="addWatchlistSymbol()">+ Add</button>
  </div>

  <!-- Zone thresholds -->
  <div class="controls" style="margin-bottom:12px;">
    <div class="wl-pct-row">
      <div class="ctrl-group">
        <label>🟢 Buy zone (52W low ×)</label>
        <input type="number" id="buyZonePct" value="105" min="100" max="200" step="1">
      </div>
      <div class="ctrl-group">
        <label>🟡 Watch zone (52W low ×)</label>
        <input type="number" id="watchZonePct" value="110" min="100" max="200" step="1">
      </div>
    </div>
  </div>

  <!-- Zone filter buttons -->
  <div class="wl-filter-row">
    <button class="zone-filter-btn active-all" id="zfAll"   onclick="setZoneFilter('all')">All</button>
    <button class="zone-filter-btn" id="zfBuy"   onclick="setZoneFilter('buy')">🟢 Buy zone</button>
    <button class="zone-filter-btn" id="zfWatch" onclick="setZoneFilter('watch')">🟡 Watch zone</button>
  </div>
  <div style="margin-bottom:12px;">
    <button class="zone-filter-btn full" id="hideOwnedBtn" onclick="toggleHideOwned()" style="width:100%;text-align:center;">
      👜 Hide stocks I already own
    </button>
  </div>

  <!-- Summary -->
  <div class="summary-grid" id="wlSummaryGrid"></div>
  <div id="wlArea"></div>
</div>

<!-- ══════════════════════════════════════════════════
     TAB 3: SIGNALS (Combined Score)
═══════════════════════════════════════════════════ -->
<div id="tab-signals" style="display:none">
  <div class="header">
    <h1>📊 Buy Signals</h1>
    <button class="refresh-btn" onclick="refreshWatchlist()">↻ Refresh</button>
  </div>
  <div class="price-updated" id="signalsPriceUpdated">Loading...</div>

  <div style="background:#e3eeff;border-radius:10px;padding:12px;margin-bottom:12px;font-size:12px;color:#1a5fa8;line-height:1.6">
    <strong>Combined Score Strategy</strong> — scores each stock across 4 technical signals:<br>
    📉 52W Low proximity (30%) · 📈 RSI oversold (25%) · 📊 Price vs 200MA (25%) · ✨ MA Cross (20%)
  </div>

  <!-- Zone filter -->
  <div class="wl-filter-row" style="margin-bottom:12px">
    <button class="zone-filter-btn active-all" id="sfAll"   onclick="setSignalFilter('all')">All</button>
    <button class="zone-filter-btn" id="sfBuy"   onclick="setSignalFilter('buy')">🟢 Score ≥70</button>
    <button class="zone-filter-btn" id="sfWatch" onclick="setSignalFilter('watch')">🟡 Score ≥45</button>
  </div>

  <!-- Hide owned -->
  <div style="margin-bottom:12px">
    <button class="zone-filter-btn full" id="hideOwnedSignalsBtn" onclick="toggleHideOwnedSignals()" style="width:100%;text-align:center;">
      👜 Hide stocks I already own
    </button>
  </div>

  <!-- Zone thresholds -->
  <div class="controls" style="margin-bottom:12px;">
    <div class="wl-pct-row">
      <div class="ctrl-group">
        <label>🟢 Buy zone (52W low ×)</label>
        <input type="number" id="sigBuyZonePct" value="105" min="100" max="200" step="1">
      </div>
      <div class="ctrl-group">
        <label>🟡 Watch zone (52W low ×)</label>
        <input type="number" id="sigWatchZonePct" value="110" min="100" max="200" step="1">
      </div>
    </div>
  </div>

  <div class="summary-grid" id="sigSummaryGrid"></div>
  <div id="sigArea"></div>
</div>

<script src="shared.js"></script>
<script src="lots.js"></script>
<script src="watchlist.js"></script>
<script src="signals.js"></script>
<script>
// INIT
// ══════════════════════════════════════════════════
loadFromRepo();

</script>
</script>
</body>
</html>
